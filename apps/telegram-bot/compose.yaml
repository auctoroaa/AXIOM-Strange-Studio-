services:
  telegram-bot:
    image: ${TELEGRAM_BOT_IMAGE:-ghcr.io/auctoroaa/axiom-telegram-bot:latest}
    container_name: axiom-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
    ports:
      - "127.0.0.1:${TELEGRAM_BOT_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
